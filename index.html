  <style>
    /* RGB-split glitch on the label (hover / touch) */
    #label::before, #label::after {
      content: attr(data-text); position: absolute; inset: 0; padding-left: inherit;
      opacity: 0; pointer-events: none; white-space: nowrap;
    }
    #label::before { color: #22d3ee; }
    #label::after  { color: #f43f5e; }
    #label.glitch::before { opacity: .7; animation: g1 .55s steps(2, end) infinite; }
    #label.glitch::after  { opacity: .7; animation: g2 .55s steps(2, end) infinite; }
    @keyframes g1 {
      0%   { transform: translate(-3px, -1px); clip-path: inset(0 0 62% 0); }
      25%  { transform: translate( 3px,  1px); clip-path: inset(38% 0 20% 0); }
      50%  { transform: translate(-2px,  2px); clip-path: inset(70% 0 0 0); }
      75%  { transform: translate( 2px, -2px); clip-path: inset(10% 0 55% 0); }
      100% { transform: translate(-3px,  0px); clip-path: inset(45% 0 30% 0); }

      50%  { transform: translate( 2px, -2px); clip-path: inset(30% 0 40% 0); }
      75%  { transform: translate(-2px,  2px); clip-path: inset(65% 0 5% 0); }
      100% { transform: translate( 3px,  0px); clip-path: inset(15% 0 60% 0); }
    }
    /* RGB-split glitch on the digits */
    .digit .gl { opacity: 0; pointer-events: none; }
    .digit.glitch .gl-c { opacity: .75; animation: d1 .42s steps(2, end) infinite; }
    .digit.glitch .gl-r { opacity: .75; animation: d2 .42s steps(2, end) infinite; }
    .digit.glitch .face { animation: fj .42s steps(2, end) infinite; }
    @keyframes d1 {
      0%   { transform: translate3d(-.035em, -.012em, 2px); clip-path: inset(0 0 58% 0); }

    }
    @keyframes d2 {
      0%   { transform: translate3d( .035em,  .012em, 2px); clip-path: inset(52% 0 0 0); }
      25%  { transform: translate3d(-.03em, -.01em, 2px);   clip-path: inset(0 0 66% 0); }
      50%  { transform: translate3d( .025em, -.02em, 2px);  clip-path: inset(28% 0 42% 0); }

    var glitchTimer;
    function flicker() {                                   // short RGB-split burst, then settle
      label.classList.add('glitch'); clearTimeout(glitchTimer);
      glitchTimer = setTimeout(function () { label.classList.remove('glitch'); }, 520);
    }
    label.addEventListener('pointerenter', flicker);
    label.addEventListener('pointerdown', flicker);

    /* ---------- pointer state ---------- */
    var tx = 0, ty = 0, cx = 0, cy = 0, mx = -1e4, my = -1e4;
    var active = false, boost = 0, pressing = false;
    function setTarget(px, py) {
      mx = px; my = py;
      tx = (px / innerWidth) * 2 - 1;
      ty = (py / innerHeight) * 2 - 1;
      active = true;
    }
    stage.addEventListener('pointermove', function (e) { setTarget(e.clientX, e.clientY); }, { passive: true });
    stage.addEventListener('pointerdown', function (e) { pressing = true; setTarget(e.clientX, e.clientY); });
    addEventListener('pointerup', function (e) { pressing = false; if (e.pointerType !== 'mouse') { active = false; mx = my = -1e4; } });
    stage.addEventListener('pointerleave', function () { active = false; mx = my = -1e4; });
    if (!fine && 'DeviceOrientationEvent' in window && typeof DeviceOrientationEvent.requestPermission !== 'function') {
      addEventListener('deviceorientation', function (e) {
        if (e.gamma == null) return;
        tx = Math.max(-1, Math.min(1, e.gamma / 30));
        ty = Math.max(-1, Math.min(1, (e.beta - 45) / 30));
        active = true;
      }, { passive: true });
    }

    /* ---------- starfield ---------- */
    var W, H, dpr, stars = [], N;
    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 1.5);
      W = canvas.width = innerWidth * dpr; H = canvas.height = innerHeight * dpr;
      N = innerWidth < 640 ? 700 : 1400;
      stars = [];
      for (var i = 0; i < N; i++) stars.push(newStar(Math.random()));
    }
    function newStar(z) {
      var a = W / H;
      return { x: (Math.random() * 2 - 1) * 1.6 * a, y: (Math.random() * 2 - 1) * 1.6, z: z,
               c: Math.random() < 0.75 ? '255,255,255' : (Math.random() < 0.5 ? '255,220,180' : '180,205,255'),
               s: 0.7 + Math.random() * 1.3, px: 0, py: 0 };
    }
    addEventListener('resize', resize, { passive: true });
    resize();

    /* ---------- main loop ---------- */
    var last = performance.now(), tick = 0;
    function frame(now) {
      var dt = Math.min(0.05, (now - last) / 1000); last = now; tick++;

      var idle = !active;
      if (idle) { tx = Math.sin(now / 2600) * 0.35; ty = Math.cos(now / 3400) * 0.25; }
      cx += (tx - cx) * (idle ? 0.025 : 0.09);
      cy += (ty - cy) * (idle ? 0.025 : 0.09);
      boost += ((pressing ? 1 : 0) - boost) * 0.05;

      if (!reduce) {
        tilt.style.transform = 'rotateX(' + (-cy * 18) + 'deg) rotateY(' + (cx * 26) + 'deg)';
        neb.style.transform = 'translate3d(' + (cx * -28) + 'px,' + (cy * -20) + 'px,0)';
      }

      // --- digits: pop toward the cursor when hovered, glint follows the cursor on each face ---
      for (var i = 0; i < digits.length; i++) {
        var D = digits[i], r = D.el.getBoundingClientRect();
        var inside = mx >= r.left && mx <= r.right && my >= r.top && my <= r.bottom;
        if (inside && !D.inside) glitchDigit(D.el, 480);     // burst as the cursor enters a digit
        D.inside = inside;
        D.pop += ((inside && !reduce ? 1 : 0) - D.pop) * 0.12;
        if (!D.el.classList.contains('spin'))
          D.el.style.transform = 'translateZ(' + (D.pop * 90) + 'px) scale(' + (1 + D.pop * 0.05) + ')';
        D.glow.style.opacity = 0.3 + D.pop * 0.55;
        D.glow.style.color = D.pop > 0.5 ? '#fb7185' : '#f0abfc';
        if (tick % 2 === 0) {
          var gx = idle ? 50 + cx * 38 : ((mx - r.left) / r.width) * 100;
          var gy = idle ? 45 + cy * 30 : ((my - r.top) / r.height) * 100;
          D.glint.style.setProperty('--gx', Math.max(-40, Math.min(140, gx)) + '%');
          D.glint.style.setProperty('--gy', Math.max(-40, Math.min(140, gy)) + '%');
        }
      }

      // --- label letters: ripple up as the cursor passes, white-hot at the centre ---
      var R = small ? 90 : 150;
      for (var j = 0; j < letters.length; j++) {
        var L = letters[j], lr = L.el.getBoundingClientRect();
        var lx = lr.left + lr.width / 2, ly = lr.top + lr.height / 2;
        var dist = Math.hypot(mx - lx, my - ly);
        var target = reduce ? 0 : Math.max(0, 1 - dist / R);
        target = target * target * (3 - 2 * target);                 // smoothstep
        L.lift += (target - L.lift) * 0.18;
        var k = L.lift;
        L.el.style.transform = 'translate3d(0,' + (-k * 14) + 'px,' + (k * 40) + 'px) scale(' + (1 + k * 0.18) + ')';
        var cr = Math.round(251 + (255 - 251) * k), cg = Math.round(113 + (255 - 113) * k), cb = Math.round(133 + (255 - 133) * k);
        L.el.style.color = 'rgb(' + cr + ',' + cg + ',' + cb + ')';
        L.el.style.textShadow = '0 0 ' + (18 + k * 22) + 'px rgba(251,113,133,' + (0.55 + k * 0.45) + ')';
      }

      // --- stars ---
      var speed = reduce ? 0 : (0.12 + boost * 1.1) * dt;
      var f = H * 0.55, camX = cx * 0.55, camY = cy * 0.4;
      ctx.clearRect(0, 0, W, H);
      ctx.lineCap = 'round';
      for (var s = 0; s < stars.length; s++) {
        var st = stars[s], ox = st.px, oy = st.py;
        st.z -= speed;
        if (st.z <= 0.02) { stars[s] = st = newStar(1); st.z = 1; }
        var kk = f / st.z;
        var x = W / 2 + (st.x - camX * (1 - st.z)) * kk;
        var y = H / 2 + (st.y - camY * (1 - st.z)) * kk;
        st.px = x; st.py = y;
        if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;
        var depthA = (0.22 + 0.78 * (1 - st.z)) * Math.min(1, (1 - st.z) * 12);
        var rad = st.s * dpr * (0.45 + (1 - st.z) * 1.6);
        if (boost > 0.05 && ox) {
          ctx.strokeStyle = 'rgba(' + st.c + ',' + (depthA * 0.7 * boost) + ')';
          ctx.lineWidth = rad * 1.4;
          ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(x, y); ctx.stroke();
        }
        ctx.fillStyle = 'rgba(' + st.c + ',' + depthA + ')';
        ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.2832); ctx.fill();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
